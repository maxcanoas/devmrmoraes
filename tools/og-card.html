<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../css/style.css" />
<style>
  /* Peca de compartilhamento, 1200x630. Usa os tokens e as fontes do site, com a
     composicao refeita para o formato deitado: a chamada e o retrato dividem a metade
     de cima, e os cinco carros-chefe ocupam a largura inteira embaixo.
     Cinco e nao nove: o card e lido a uns 350px de largura dentro do WhatsApp, e nove
     nomes obrigavam um corpo em que ninguem le de relance. Os outros quatro servicos
     continuam na home e no rodape. */
  html, body { margin: 0; }
  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    display: grid;
    grid-template-rows: auto auto;
    align-content: space-between;
    padding: 50px 64px 46px;
    box-sizing: border-box;
  }
  .topo {
    display: grid;
    grid-template-columns: 1fr 240px;
    gap: 56px;
    align-items: stretch;
  }
  .topo > div:first-child {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .marca {
    font-weight: 700;
    font-size: 28px;
    letter-spacing: -0.03em;
    color: var(--grafite);
  }
  .marca span { color: var(--caneta); }
  .chamada {
    font-size: 47px;
    font-weight: 700;
    line-height: 1.07;
    letter-spacing: -0.03em;
    margin: 26px 0 auto;
    max-width: 19ch;
    text-wrap: balance;
  }
  .onde {
    font-family: var(--fonte-mono);
    font-size: 19px;
    color: var(--grafite-2);
    margin-top: 0;
  }
  figure { margin: 0; }
  figure img {
    width: 240px;
    height: 300px;
    object-fit: cover;
    object-position: center 16%;
    border: 1px solid var(--impresso);
    border-radius: 2px;
    display: block;
  }
  .nome { font-family: var(--fonte); font-size: 22px; font-weight: 700; letter-spacing: -0.02em; display: block; margin-top: 12px; }
  .funcao {
    font-family: var(--fonte-mono);
    font-size: 15px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--caneta);
    display: block;
    margin-top: 2px;
  }

  /* O fio e o mesmo eixo da home, e aqui ele separa quem eu sou do que eu faco. */
  .servicos {
    border-top: 3px solid var(--grafite);
    margin-top: 22px;
    padding-top: 18px;
  }
  .servicos ul {
    list-style: none;
    margin: 0;
    padding: 0;
    columns: 2;
    column-gap: 56px;
  }
  .servicos li {
    font-size: 27px;
    line-height: 1.25;
    padding: 6px 0;
    break-inside: avoid;
    color: var(--grafite);
  }
</style>
</head>
<body>
  <div class="topo">
    <div>
      <p class="marca">DEV<span>MR</span>MORAES</p>
      <p class="chamada">Sites que trazem cliente e sistemas que tiram trabalho da sua mesa.</p>
      <p class="onde">Canoas e Porto Alegre · remoto no Brasil</p>
    </div>
    <figure>
      <img src="../img/maxwell-rigo-moraes.jpg" alt="" />
      <figcaption>
        <span class="nome">Maxwell Rigo Moraes</span>
        <span class="funcao">Desenvolvedor</span>
      </figcaption>
    </figure>
  </div>

  <div class="servicos">
    <ul>
      <li>Criação de sites</li>
      <li>SEO e manutenção de sites</li>
      <li>Sistemas personalizados</li>
      <li>Perfil da Empresa no Google</li>
      <li>Aplicativos mobile</li>
    </ul>
  </div>
</body>
</html>
