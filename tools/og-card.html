<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../css/style.css" />
<style>
  /* Peca de compartilhamento, 1200x630, na direcao A virada. Usa os tokens e as fontes do
     site: breu, a chamada em Gabarito, a linha da virada em cobalto, o retrato em preto e
     branco e os cinco carros-chefe embaixo. Cinco e nao nove: o card e lido a uns 350px
     de largura dentro do WhatsApp, e nove nomes obrigavam um corpo que ninguem le. */
  html, body { margin: 0; }
  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    display: grid;
    grid-template-rows: auto auto;
    align-content: space-between;
    padding: 48px 64px 44px;
    box-sizing: border-box;
    background: var(--fundo);
    color: var(--texto);
  }
  .topo {
    display: grid;
    grid-template-columns: 1fr 224px;
    gap: 56px;
    align-items: stretch;
  }
  .topo > div:first-child {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .marca {
    font-family: var(--fonte-display);
    font-weight: 800;
    font-size: 28px;
    letter-spacing: -0.02em;
  }
  .marca span { color: var(--acao-texto); }
  .chamada {
    font-family: var(--fonte-display);
    font-size: 60px;
    font-weight: 900;
    line-height: 0.98;
    letter-spacing: -0.03em;
    margin: 22px 0 auto;
    max-width: 14ch;
    text-wrap: balance;
  }
  .onde {
    font-size: 20px;
    font-weight: 500;
    color: var(--texto-2);
    margin-top: 0;
  }
  figure { margin: 0; }
  figure img {
    width: 224px;
    height: 280px;
    object-fit: cover;
    object-position: center 18%;
    border-radius: 3px;
    display: block;
    filter: grayscale(1) contrast(1.04);
  }
  .nome { font-weight: 600; font-size: 20px; display: block; margin-top: 12px; }
  .funcao {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--acao-texto);
    display: block;
    margin-top: 4px;
  }

  /* A linha da virada separa quem eu sou do que eu faco. */
  .servicos {
    border-top: 4px solid var(--acao);
    margin-top: 22px;
    padding-top: 18px;
  }
  .servicos ul {
    list-style: none;
    margin: 0;
    padding: 0;
    columns: 2;
    column-gap: 56px;
  }
  .servicos li {
    font-family: var(--fonte-display);
    font-weight: 700;
    font-size: 27px;
    letter-spacing: -0.01em;
    line-height: 1.25;
    padding: 6px 0;
    break-inside: avoid;
  }
  .servicos li::before {
    content: '';
    display: inline-block;
    width: 0.42em;
    height: 0.42em;
    background: var(--resultado);
    margin-right: 0.45em;
    vertical-align: 0.1em;
  }
</style>
</head>
<body>
  <div class="topo">
    <div>
      <p class="marca">DEV<span>MR</span>MORAES</p>
      <p class="chamada">Sites que trazem cliente e sistemas que tiram trabalho da sua mesa.</p>
      <p class="onde">Canoas e Porto Alegre · remoto no Brasil</p>
    </div>
    <figure>
      <img src="../img/maxwell-rigo-moraes.jpg" alt="" />
      <figcaption>
        <span class="nome">Maxwell Rigo Moraes</span>
        <span class="funcao">Desenvolvedor</span>
      </figcaption>
    </figure>
  </div>

  <div class="servicos">
    <ul>
      <li>Criação de sites</li>
      <li>SEO e manutenção de sites</li>
      <li>Sistemas personalizados</li>
      <li>Perfil da Empresa no Google</li>
      <li>Aplicativos mobile</li>
    </ul>
  </div>
</body>
</html>
