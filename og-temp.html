<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<style>
  @font-face {
    font-family: 'Schibsted Grotesk';
    src: url('http://127.0.0.1:8099/fonts/schibsted-grotesk-latin.woff2') format('woff2');
    font-weight: 400 700;
  }
  @font-face {
    font-family: 'IBM Plex Mono';
    src: url('http://127.0.0.1:8099/fonts/ibm-plex-mono-latin.woff2') format('woff2');
    font-weight: 400;
  }
  * { margin: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px;
    background: #F5F2ED;
    color: #15171A;
    font-family: 'Schibsted Grotesk', sans-serif;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 72px 80px;
    border-left: 12px solid #B0350F;
  }
  .marca { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }
  .marca span { color: #B0350F; }
  h1 {
    font-size: 76px; font-weight: 700; line-height: 1.05;
    letter-spacing: -0.03em; max-width: 20ch;
  }
  .rodape {
    display: flex; justify-content: space-between; align-items: flex-end;
    border-top: 1px solid #DDD8D0; padding-top: 24px;
  }
  .mono {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 19px; letter-spacing: 0.04em; text-transform: uppercase;
    color: #4B5058;
  }
</style>
</head>
<body>
  <p class="marca">DEV<span>MR</span>MORAES</p>
  <h1>Sites e sistemas para empresas de Canoas e Porto Alegre.</h1>
  <div class="rodape">
    <p class="mono">Maxwell Rigo Moraes · Canoas RS</p>
    <p class="mono">devmrmoraes.com.br</p>
  </div>
</body>
</html>
